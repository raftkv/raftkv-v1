      # 双模式授权防线（2026-09-01 项目组决议二）：closed=授权失败拒绝启动（出厂默认）
      # 严禁改为 open，除非被许可方已签署并生效《授权到期降级只读补充条款》
      LICENSE_FAIL_MODE: "closed"
      PEERS: node-1=raft-node-1:9500,node-2=raft-node-2:9501,node-3=raft-node-3:9502,node-4=raft-node-4:9604
    ports:
      - "9605:9605"
      - "9105:9000"
    networks:
      - raftkv-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
