services:
  node-1:
    image: raftkit-gateway:v1
    container_name: raft-qs-1
    environment:
      - SM4_KEY=726166746b765f736d34746573743031
      - NODE_ID=node-1
      - GRPC_PORT=9500
      - HTTP_PORT=9000
      - HTTP_BIND=0.0.0.0
      - PEERS=node-2=node-2:9500,node-3=node-3:9500,node-4=node-4:9500,node-5=node-5:9500
      - LICENSE_FAIL_MODE=open
      - IDEM_TOKEN_CAPACITY=5
      - WAL_PATH=/tmp/raft.wal
    networks:
      qs-net:
        aliases:
          - node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

