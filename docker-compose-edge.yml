# =========================================================================
# RaftKV 一键部署 — 5节点Raft集群
# 启动: docker-compose -f docker-compose-edge.yml up -d
# 停止: docker-compose -f docker-compose-edge.yml down
# =========================================================================
services:
  node-1:
    image: raftkv-edge:latest
    restart: always
    cap_add: [NET_ADMIN]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ID: node-1
      GRPC_PORT: "9500"
      HTTP_PORT: "9000"
      PEERS: node-2=node-2:9501,node-3=node-3:9502,node-4=node-4:9604,node-5=node-5:9605
    ports: ["9500:9500", "9001:9000"]
    networks: [edge-net]

  node-2:
    image: raftkv-edge:latest
    restart: always
    cap_add: [NET_ADMIN]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ID: node-2
      GRPC_PORT: "9501"
      HTTP_PORT: "9000"
      PEERS: node-1=node-1:9500,node-3=node-3:9502,node-4=node-4:9604,node-5=node-5:9605
    ports: ["9501:9501", "9002:9000"]
    networks: [edge-net]

  node-3:
    image: raftkv-edge:latest
    restart: always
    cap_add: [NET_ADMIN]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ID: node-3
      GRPC_PORT: "9502"
      HTTP_PORT: "9000"
      PEERS: node-1=node-1:9500,node-2=node-2:9501,node-4=node-4:9604,node-5=node-5:9605
    ports: ["9502:9502", "9003:9000"]
    networks: [edge-net]

  node-4:
    image: raftkv-edge:latest
    restart: always
    cap_add: [NET_ADMIN]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ID: node-4
      GRPC_PORT: "9604"
      HTTP_PORT: "9000"
      PEERS: node-1=node-1:9500,node-2=node-2:9501,node-3=node-3:9502,node-5=node-5:9605
    ports: ["9604:9604", "9104:9000"]
    networks: [edge-net]

  node-5:
    image: raftkv-edge:latest
    restart: always
    cap_add: [NET_ADMIN]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ID: node-5
      GRPC_PORT: "9605"
      HTTP_PORT: "9000"
      PEERS: node-1=node-1:9500,node-2=node-2:9501,node-3=node-3:9502,node-4=node-4:9604
    ports: ["9605:9605", "9105:9000"]
    networks: [edge-net]

networks:
  edge-net:
    driver: bridge