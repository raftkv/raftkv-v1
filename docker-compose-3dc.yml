networks:
  dc1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
  dc2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.0.0/24
  dc3-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.3.0.0/24
  inter-dc:
    driver: bridge