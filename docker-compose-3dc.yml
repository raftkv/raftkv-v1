      PEERS: dc1-n1=raftkv-dc1-n1:9700,dc1-n2=raftkv-dc1-n2:9701,dc1-n3=raftkv-dc1-n3:9702,dc2-n1=raftkv-dc2-n1:9710,dc2-n2=raftkv-dc2-n2:9711,dc2-n3=raftkv-dc2-n3:9712,dc3-n1=raftkv-dc3-n1:9720,dc3-n3=raftkv-dc3-n3:9722
    ports:
      - "9721:9721"
      - "9222:9000"
    networks:
