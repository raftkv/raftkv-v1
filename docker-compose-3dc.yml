    ports:
      - "9711:9711"
      - "9212:9000"
    networks:
      dc2-net:
        ipv4_address: 10.2.0.12
      inter-dc:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  dc2-n3:
    image: raftkv-gateway:latest
    container_name: raftkv-dc2-n3
    restart: always
    environment:
      NODE_ID: dc2-n3
      GRPC_PORT: "9712"
      HTTP_PORT: "9000"
      PEERS: dc1-n1=raftkv-dc1-n1:9700,dc1-n2=raftkv-dc1-n2:9701,dc1-n3=raftkv-dc1-n3:9702,dc2-n1=raftkv-dc2-n1:9710,dc2-n2=raftkv-dc2-n2:9711,dc3-n1=raftkv-dc3-n1:9720,dc3-n2=raftkv-dc3-n2:9721,dc3-n3=raftkv-dc3-n3:9722
    ports:
      - "9712:9712"
      - "9213:9000"
    networks:
      dc2-net:
        ipv4_address: 10.2.0.13
      inter-dc:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

