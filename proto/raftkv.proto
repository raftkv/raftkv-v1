syntax = "proto3";

package raftkv;

option go_package = "raftkv/proto";

// RaftKV — Raft consensus gRPC service definition
// Pure Go implementation, no external Raft library
// Copyright (C) 2026 RaftKV Project

service RaftService {
    // 请求投票 — Candidate 发起，用于 Leader 选举
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

    // 追加日志条目 — Leader 发起，用于心跳和日志复制
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

}

message RequestVoteRequest {
    int64  term         = 1;  // 候选者当前任期号
    string candidate_id = 2;  // 候选者节点 ID
    int64  last_log_index = 3;  // 候选者最后一条日志的索引
    int64  last_log_term  = 4;  // 候选者最后一条日志的任期
}

message RequestVoteResponse {
    int64 term         = 1;  // 当前任期号（用于候选者更新自己的任期）
    bool  vote_granted = 2;  // 是否投票给该候选者
}

message LogEntry {
    int64  term    = 1;  // 日志条目所属任期
    int64  index   = 2;  // 日志条目的全局索引
    bytes  command = 3;  // 状态机命令（序列化后的业务数据）
    bytes  sm3_hash = 4; // SM3 国密哈希（防篡改链式校验）
}

message AppendEntriesRequest {
    int64  term              = 1;  // Leader 当前任期号
    string leader_id         = 2;  // Leader 节点 ID
    int64  prev_log_index    = 3;  // 新条目之前一条日志的索引
    int64  prev_log_term     = 4;  // prev_log_index 条目的任期号
    repeated LogEntry entries = 5; // 待复制的新日志条目（心跳时为空）
    int64  leader_commit     = 6;  // Leader 已提交的最高日志索引
}

message AppendEntriesResponse {
    int64  term    = 1;  // 当前任期号
    bool   success = 2;  // 是否成功（prevLogIndex/prevLogTerm 匹配）
}

