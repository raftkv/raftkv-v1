# RaftKV Quickstart Deployment — 5-Node Cluster
#
# Simplified docker-compose for quick evaluation. Builds from source.
# Uses LICENSE_FAIL_MODE=open (degraded read-only mode) for demo purposes.
#
# Usage:
#   docker compose -f examples/docker-compose-quickstart.yml up -d
#   go run examples/kv_client/main.go http://localhost:9001
#
# Note: In degraded mode, writes are rejected. To enable writes,
# obtain a commercial license key and mount it into
# the containers, then set LICENSE_FAIL_MODE=closed.

services:
  node-1:
    build: ..
    container_name: raft-node-1
    ports:
      - "9001:9000"
      - "9501:9500"
    environment:
      - SM4_KEY=726166746b765f736d34746573743031  # TEST KEY ONLY - do not use in production
      - NODE_ID=node-1
      - GRPC_PORT=9500
      - HTTP_PORT=9000
      - HTTP_BIND=0.0.0.0
      - PEERS=node-2=node-2:9500,node-3=node-3:9500,node-4=node-4:9500,node-5=node-5:9500
      - LICENSE_FAIL_MODE=open
      - IDEM_TOKEN_CAPACITY=5
      - WAL_PATH=/tmp/raft.wal
    networks:
      raftkv-quickstart:
        aliases:
          - node-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

