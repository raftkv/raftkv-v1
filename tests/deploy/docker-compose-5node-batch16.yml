services:
  node-1:
    environment:
      - RATE_LIMIT_ENABLED=true
      - STRUCTURED_LOG=true
      - IN_FLIGHT_CAP=256
      - TLS_CERT_FILE=/app/certs/node-1-cert.pem
      - TLS_KEY_FILE=/app/certs/node-1-key.pem
      - TLS_CA_FILE=/app/certs/ca-cert.pem
      - TLS_CLIENT_CERT_FILE=/app/certs/node-1-cert.pem
      - TLS_CLIENT_KEY_FILE=/app/certs/node-1-key.pem
    volumes:
      - ./certs:/app/certs:ro
